<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1BD73" />
      <stop offset="35%" stop-color="#C99A4A" />
      <stop offset="70%" stop-color="#F3DC9B" />
      <stop offset="100%" stop-color="#9E7227" />
    </linearGradient>
    
    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#C9C9C9" />
      <stop offset="100%" stop-color="#8E8E8E" />
    </linearGradient>

    <!-- Dark Luxury Background Gradient -->
    <radialGradient id="darkBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A1A" />
      <stop offset="85%" stop-color="#0B0B0B" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Curved Text Path -->
    <path id="textCircleTop" d="M 60,200 A 140,140 0 1,1 340,200" fill="none" />
    <path id="textCircleBottom" d="M 340,200 A 140,140 0 0,1 60,200" fill="none" />
  </defs>

  <!-- Outer Dark Circular Background -->
  <circle cx="200" cy="200" r="190" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#luxuryGlow)" />

  <!-- Inner Concentric Rings -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#2A2A2A" stroke-width="1" stroke-dasharray="3,3" />
  <circle cx="200" cy="200" r="148" fill="none" stroke="url(#silverGrad)" stroke-width="1.2" opacity="0.85" />
  <circle cx="200" cy="200" r="112" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Top Circular Text: JB FURNITURE & INTERIOR -->
  <text font-family="'Playfair Display', 'Cinzel', serif" font-size="14" font-weight="600" letter-spacing="4.5" fill="url(#goldGrad)">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      JB FURNITURE &amp; INTERIOR
    </textPath>
  </text>

  <!-- Bottom Circular Text: CUSTOM FURNITURE • PUNE -->
  <text font-family="'Montserrat', 'Inter', sans-serif" font-size="10.5" font-weight="500" letter-spacing="4" fill="url(#silverGrad)">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      CUSTOM CRAFT • PUNE
    </textPath>
  </text>

  <!-- Star / Diamond Accents on Ring -->
  <path d="M 52,200 L 56,196 L 60,200 L 56,204 Z" fill="url(#goldGrad)" />
  <path d="M 340,200 L 344,196 L 348,200 L 344,204 Z" fill="url(#goldGrad)" />

  <!-- Center Luxury Monogram "JB" & Architectural Geometry -->
  <g transform="translate(200, 200)">
    <!-- Architectural subtle cross-lines -->
    <line x1="-80" y1="0" x2="-45" y2="0" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />
    <line x1="45" y1="0" x2="80" y2="0" stroke="url(#goldGrad)" stroke-width="1" opacity="0.6" />
    
    <!-- Geometric Monogram JB -->
    <!-- Stylized "J" -->
    <path d="M -16,-46 L -6,-46 L -6,22 C -6,34 -15,44 -28,44 C -38,44 -46,36 -46,26 L -36,26 C -36,30 -32,34 -28,34 C -20,34 -16,28 -16,20 Z" fill="url(#goldGrad)" />

    <!-- Stylized "B" intertwining -->
    <path d="M -2,-46 L 24,-46 C 36,-46 46,-38 46,-26 C 46,-17 40,-10 32,-7 C 42,-4 48,4 48,15 C 48,28 37,44 22,44 L -2,44 Z M 8,-36 L 8,-12 L 23,-12 C 29,-12 35,-16 35,-24 C 35,-32 29,-36 23,-36 Z M 8,-2 L 8,34 L 23,34 C 30,34 37,28 37,16 C 37,4 30,-2 23,-2 Z" fill="url(#silverGrad)" />

    <!-- Fine Gold Inlay Divider in B -->
    <line x1="8" y1="-7" x2="28" y2="-7" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Tiny architectural detail below monogram -->
    <polygon points="0,58 -4,64 4,64" fill="url(#goldGrad)" />
  </g>
</svg>
